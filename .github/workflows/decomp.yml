name: decomp

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check de los scripts
        run: |
          for f in scripts/*.mjs; do
            node --check "$f"
          done

      - name: Gate de decompilación
        run: node scripts/validate-decomp.mjs
