name: launcher

on:
  push:
    branches: [main, visual/advance-display-and-main-loop]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: launcher (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: SDL2 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl -L -o llvm-mingw.zip https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-x86_64.zip
          Expand-Archive llvm-mingw.zip -DestinationPath C:\llvm-mingw
          "C:\llvm-mingw\llvm-mingw-20261020-ucrt-x86_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Configure
        run: cmake -S launcher -B build/launcher -G Ninja -DOE_CONSOLE=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        run: cmake --build build/launcher

      - name: Smoke test (Unix)
        if: runner.os == 'Linux'
        run: |
          ./build/launcher/bin/overetheria-launcher --version
          ./build/launcher/bin/overetheria-launcher --data-dir
          ./build/launcher/bin/overetheria-launcher --print-paths | tee /tmp/oe-paths.txt
          grep -qE '^exe=.*/ps2run$' /tmp/oe-paths.txt

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "build/launcher/bin/Release/overetheria-launcher.exe"
          if (-not (Test-Path $exe)) { $exe = "build/launcher/bin/overetheria-launcher.exe" }
          if (-not (Test-Path $exe)) { throw "no se encontró el ejecutable en build/launcher/bin" }
          $exe = (Resolve-Path $exe).Path
          $dir = Split-Path -Parent $exe
          if (-not (Test-Path (Join-Path $dir 'SDL2.dll'))) { throw "falta SDL2.dll junto al ejecutable" }
          Push-Location $dir
          $out = & $exe --version 2>&1
          $code = $LASTEXITCODE
          Pop-Location
          Write-Output "exit=$code out=$out"
          if ($code -ne 0) { throw "launcher --version devolvió $code" }
          if ("$out" -notmatch '\d+\.\d+') { throw "sin salida de versión: $out" }
          $paths = & $exe --print-paths 2>&1
          Write-Output $paths
          if ("$paths" -notmatch 'exe=.*ps2run\.exe') { throw "la ruta del ejecutable no termina en ps2run.exe" }

  no-game-content:
    name: no game content tracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject ISO/BIOS/ELF/overlays/generated code in git
        run: |
          set -e
          bad=$(git ls-files | grep -Ei '\.(iso|bin|pss|irx|elf|ps2)$|^generated/|^decomp/src/' || true)
          if [ -n "$bad" ]; then
            echo "Archivos con contenido del juego versionados:"
            echo "$bad"
            exit 1
          fi
          echo "sin contenido del juego versionado"

  scripts:
    name: scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash syntax
        run: bash -n scripts/prepare-game.sh
      - name: PowerShell parser
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/prepare-game.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
