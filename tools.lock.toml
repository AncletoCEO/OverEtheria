# Pins de herramientas externas.
# `tools/` está ignorado por git: este archivo es la fuente de verdad de versiones.
# Formato: TOML plano, sin dependencias.

schema = 1
tools_dir = "tools"

[rea]
repo = "https://github.com/morluto/rea"
commit = "6be6596aaca5a9f584fd726b9ca7733d5b54f55a"
version = "6.8.0"
license = "MIT"
role = "MCP de reverse engineering"
local_path = "tools/rea"
note = "Hoy no puede abrir el ELF PS2 (ver docs/analysis/06-herramientas.md)."

[ps2recomp]
repo = "https://github.com/AncletoCEO/Ps2Recomp-of-etheria"
upstream = "https://github.com/ran-j/PS2Recomp"
commit = "7364cc68a25b11cf28bfc6c1d29ad011f318fedd"
license = "GPL-3.0"
role = "recompilador estático + runtime del juego"
local_path = "tools/PS2Recomp"
note = "Commit pineado por el CI del proyecto legado. No soporta overlays todavía."

[pcsx2]
version = "2.9.153"
license = "GPL-3.0"
role = "emulador de referencia (savestates, PINE)"
local_path = "tools/pcsx2"

[legacy-recomp]
repo = "https://github.com/AncletoCEO/Sword-Of-Etheria-PC-Recomp"
commit = "6e49d96245008c2e7c2aa80e296ec5996437a42d"
license = "MIT (repo) / GPL-3.0 (runtime enlazado)"
role = "intento anterior de recompilación; solo referencia"
local_path = "tools/legacy-recomp"
note = "No se reutiliza su historia git: este repo arranca de cero."

[jdk]
version = "21.0.13+9"
vendor = "Eclipse Temurin"
license = "GPL-2.0 with Classpath Exception"
role = "runtime de Ghidra"
local_path = "tools/jdk"

[ghidra]
version = "12.1.4"
license = "Apache-2.0"
role = "decompilador headless y GUI"
local_path = "tools/ghidra"
note = "12.2 exige JDK 25; 12.1.4 es la versión del intento previo."

[zig]
version = "0.15.1"
license = "MIT"
role = "ensamblador MIPS para verificación (clang/LLVM embebido)"
local_path = "tools/zig"

[w64devkit]
version = "2.11.0"
license = "Unlicense (con componentes de terceros)"
role = "GCC 16.2.0 + MinGW-w64 + GNU Make 4.4.1 + busybox"
local_path = "tools/w64devkit"

[cmake]
version = "4.4.5"
license = "BSD-3-Clause"
role = "generador de build del recomp y del juego"
local_path = "tools/cmake"

[python]
version = "3.12.10"
license = "PSF-2.0"
role = "scripts de build (embebido, sin pip)"
local_path = "tools/python"

[ghidra-emotionengine]
release = "v2.1.39"
asset = "ghidra_12.1.4_PUBLIC_20261029_ghidra-emotionengine-reloaded.zip"
license = "Apache-2.0"
role = "procesador R5900 (64-bit, MMI, VU0 macro) y analizadores"
local_path = "tools/ghidra/Ghidra/Processors/R5900"
note = "El zip trae Module.manifest vacío; se completó y r5900.sla se compiló con support/sleigh."
